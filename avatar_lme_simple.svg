<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 深蓝背景 -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a3e"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </radialGradient>
    
    <!-- 月亮光晕 -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffd700;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="500" height="500" fill="url(#bg)"/>
  
  <!-- 中心组 -->
  <g transform="translate(250, 250)">
    <!-- 光晕 -->
    <circle cx="0" cy="0" r="140" fill="url(#glow)"/>
    
    <!-- 外圈：辛几何轨道（椭圆） -->
    <ellipse cx="0" cy="0" rx="130" ry="90" fill="none" stroke="#00d4ff" stroke-width="3" opacity="0.6" transform="rotate(-15)"/>
    
    <!-- 中圈：分形嵌套 -->
    <ellipse cx="0" cy="0" rx="100" ry="70" fill="none" stroke="#7b68ee" stroke-width="2" opacity="0.5" transform="rotate(30)"/>
    
    <!-- LME 字母 -->
    <g fill="#fff8dc" font-family="Georgia, serif" font-weight="300">
      <!-- L - 左侧竖线，融入月牙 -->
      <path d="M -60,-50 L -60,50 L -30,50" fill="none" stroke="#fff8dc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- M - 中间山峰，辛流形 -->
      <path d="M -20,50 L -20,-20 L 10,20 L 40,-20 L 40,50" fill="none" stroke="#fff8dc" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- E - 右侧横线，分形层级 -->
      <path d="M 60,-50 L 90,-50 M 60,-50 L 60,50 M 60,0 L 85,0 M 60,50 L 90,50" fill="none" stroke="#fff8dc" stroke-width="8" stroke-linecap="round"/>
    </g>
    
    <!-- 月牙弧线（连接 L 和 E） -->
    <path d="M -75,0 A 75,75 0 0,0 105,0" fill="none" stroke="#ffd700" stroke-width="4" opacity="0.8"/>
    <path d="M -75,0 A 60,60 0 0,1 90,0" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.5"/>
    
    <!-- 中心点（相空间原点） -->
    <circle cx="0" cy="0" r="4" fill="#00d4ff"/>
    
    <!-- 流动箭头（辛流方向） -->
    <path d="M 80,-60 L 90,-50 L 80,-40" fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.7"/>
    <path d="M -80,40 L -90,50 L -80,60" fill="none" stroke="#ff6b9d" stroke-width="2" opacity="0.7"/>
  </g>
  
  <!-- 外圈装饰点（分形节点） -->
  <circle cx="250" cy="80" r="3" fill="#00d4ff" opacity="0.8"/>
  <circle cx="420" cy="250" r="3" fill="#ff6b9d" opacity="0.8"/>
  <circle cx="250" cy="420" r="3" fill="#7b68ee" opacity="0.8"/>
  <circle cx="80" cy="250" r="3" fill="#ffd700" opacity="0.8"/>
</svg>