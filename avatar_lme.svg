<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 深蓝渐变背景 -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a1a3e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d1f;stop-opacity:1" />
    </radialGradient>
    
    <!-- 月亮光晕 -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff8dc;stop-opacity:0.9" />
      <stop offset="50%" style="stop-color:#ffd700;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0" />
    </radialGradient>
    
    <!-- 辛几何流 -->
    <linearGradient id="flowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.8" />
      <stop offset="50%" style="stop-color:#7b68ee;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#ff6b9d;stop-opacity:0.4" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="500" height="500" fill="url(#bgGradient)"/>
  
  <!-- 分形星星背景 -->
  <g opacity="0.6">
    <circle cx="50" cy="80" r="1.5" fill="white"/>
    <circle cx="120" cy="40" r="1" fill="white"/>
    <circle cx="380" cy="60" r="1.5" fill="white"/>
    <circle cx="450" cy="120" r="1" fill="white"/>
    <circle cx="30" cy="200" r="1" fill="white"/>
    <circle cx="470" cy="250" r="1.5" fill="white"/>
    <circle cx="80" cy="400" r="1" fill="white"/>
    <circle cx="420" cy="420" r="1.5" fill="white"/>
    <circle cx="250" cy="30" r="1" fill="white"/>
    <circle cx="200" cy="470" r="1" fill="white"/>
  </g>
  
  <!-- 辛几何相空间轨迹（分形结构） -->
  <g transform="translate(250, 250)" opacity="0.7">
    <!-- 外层轨道 -->
    <ellipse cx="0" cy="0" rx="180" ry="120" fill="none" stroke="url(#flowGradient)" stroke-width="2" transform="rotate(-30)"/>
    <ellipse cx="0" cy="0" rx="160" ry="100" fill="none" stroke="#7b68ee" stroke-width="1.5" transform="rotate(15)" opacity="0.6"/>
    
    <!-- 中层轨道（分形嵌套） -->
    <ellipse cx="0" cy="0" rx="120" ry="80" fill="none" stroke="#00d4ff" stroke-width="2" transform="rotate(45)"/>
    <ellipse cx="0" cy="0" rx="100" ry="65" fill="none" stroke="#ff6b9d" stroke-width="1.5" transform="rotate(-60)" opacity="0.7"/>
    
    <!-- 内层轨道 -->
    <ellipse cx="0" cy="0" rx="70" ry="50" fill="none" stroke="#ffd700" stroke-width="2.5" transform="rotate(75)"/>
    <ellipse cx="0" cy="0" rx="55" ry="40" fill="none" stroke="#00d4ff" stroke-width="1.5" transform="rotate(-15)" opacity="0.8"/>
    
    <!-- 中心流动线（辛流） -->
    <path d="M -40,0 Q -20,-30 0,0 T 40,0" fill="none" stroke="#fff8dc" stroke-width="2" opacity="0.9"/>
    <path d="M 0,-40 Q 30,-20 0,0 T 0,40" fill="none" stroke="#fff8dc" stroke-width="2" opacity="0.9"/>
  </g>
  
  <!-- 月亮主体 -->
  <g transform="translate(250, 250)">
    <!-- 光晕 -->
    <circle cx="0" cy="0" r="95" fill="url(#moonGlow)" opacity="0.4"/>
    
    <!-- 月牙形状（辛几何的q-p表示） -->
    <path d="M 0,-70 
             A 70,70 0 1,1 0,70 
             A 55,55 0 1,0 0,-70 Z" 
          fill="#fff8dc" 
          opacity="0.95"/>
    
    <!-- 月亮纹理（分形细节） -->
    <circle cx="-20" cy="-20" r="8" fill="#e6e6e6" opacity="0.5"/>
    <circle cx="25" cy="10" r="12" fill="#e6e6e6" opacity="0.4"/>
    <circle cx="-10" cy="35" r="6" fill="#e6e6e6" opacity="0.5"/>
    <ellipse cx="15" cy="-30" rx="10" ry="6" fill="#e6e6e6" opacity="0.3"/>
  </g>
  
  <!-- 分形装饰线（连接月亮与轨道） -->
  <g opacity="0.5">
    <line x1="250" y1="180" x2="250" y2="130" stroke="#00d4ff" stroke-width="1"/>
    <line x1="250" y1="320" x2="250" y2="370" stroke="#ff6b9d" stroke-width="1"/>
    <line x1="180" y1="250" x2="130" y2="250" stroke="#7b68ee" stroke-width="1"/>
    <line x1="320" y1="250" x2="370" y2="250" stroke="#ffd700" stroke-width="1"/>
  </g>
  
  <!-- 外圈分形装饰 -->
  <g transform="translate(250, 250)" opacity="0.3">
    <polygon points="0,-200 15,-185 0,-170 -15,-185" fill="#00d4ff"/>
    <polygon points="173,100 188,115 173,130 158,115" fill="#ff6b9d"/>
    <polygon points="-173,100 -158,115 -173,130 -188,115" fill="#7b68ee"/>
    <polygon points="0,170 15,185 0,200 -15,185" fill="#ffd700"/>
  </g>
</svg>